<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Carta</title>
    <meta name="description" content="Menú visual por QR: arma tu orden con tu mesa y el mesero la recibe en su teléfono." />
    <meta name="theme-color" content="#4F1728" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Carta" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <link rel="preload" href="/fonts/DMSerifDisplay-Regular-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/DMSans-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <noscript>Carta necesita JavaScript para mostrar el menú. Actívalo y recarga la página.</noscript>
    <div id="app">
      <!-- Arranque: se pinta con el HTML y el CSS, antes de que llegue el JS; React lo reemplaza por lo mismo (compartido/pantalla/Arranque.tsx) y después por el esqueleto de cada área. Neutro: sirve a las tres áreas. La ayuda se revela sola por CSS pasado un plazo: si el JS no llegó, la persona no se queda mirando «Un momento…» para siempre. -->
      <div class="arranque">
        <p class="arranque-marca" aria-hidden="true">Carta</p>
        <p class="arranque-texto" aria-hidden="true">Un momento…</p>
        <div class="arranque-ayuda">
          <p class="arranque-ayuda-texto">Está tardando más de lo normal. Revisa tu conexión.</p>
          <a class="arranque-reintento" href="">Volver a intentar</a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
