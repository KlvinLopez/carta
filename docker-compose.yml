# Desarrollo local: sólo PostgreSQL 16 con volumen (ADR-012, ADR-015).
# Sin Redis (caché e idempotencia van en proceso y en PostgreSQL) ni Adminer.
# La imagen de producción y sus variantes de despliegue viven en Dockerfile y deploy/ (T-0.6).
services:
  postgres:
    image: postgres:16-alpine
    container_name: carta-postgres
    environment:
      POSTGRES_USER: carta
      POSTGRES_PASSWORD: carta_dev_password
      POSTGRES_DB: carta_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_bd_desarrollo.sql:/docker-entrypoint-initdb.d/10-carta-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carta -d carta_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
