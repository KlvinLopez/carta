<title>Planos de Carta</title>
<style>
@font-face{font-family:"DM Sans";src:url(data:font/woff2;base64,__SANS__) format("woff2");font-weight:100 1000}
@font-face{font-family:"DM Serif Display";src:url(data:font/woff2;base64,__SERIF__) format("woff2")}
:root{color-scheme:light;--crema:#fef9f1;--vino:#4f1728;--vino2:#6b2d3e;--dorado:#b8860b;--tinta:#1a1a1a;--tinta2:#5b4a3d;--arena:#e6d9c6;--arena2:#f3eadb;--blanco:#ffffff;--verde:#3f6b3b;--rojo:#9b2c2c;--sombra:rgba(107,45,62,.14)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"DM Sans",sans-serif;background:var(--crema);color:var(--tinta);min-height:100vh}
button,select,input{font:inherit;color:var(--tinta)}
button{cursor:pointer}
svg text{font-family:"DM Sans",sans-serif}
svg text[font-family^="DM Serif"]{font-family:"DM Serif Display",serif}
.serif{font-family:"DM Serif Display",serif;font-weight:400}
a{color:var(--vino2)}
:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
/* cabecera */
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:16px 8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.kick{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta2);font-weight:700}
h1.op{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(26px,3.4vw,42px);line-height:1.08;color:var(--vino);margin:4px 0 0;max-width:980px;text-wrap:balance}
.et{font-size:10.5px;font-weight:700;border-radius:9999px;padding:2px 9px;border:1.5px solid var(--dorado);color:var(--dorado);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:transparent}
.et.prop{border-color:var(--vino2);color:var(--vino2)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;border-radius:9999px;padding:9px 16px;min-height:40px;font-size:13px;font-weight:700;background:var(--arena2);color:var(--tinta2);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,transform .2s}
.btn:hover{background:var(--arena);color:var(--tinta)}
.btn[aria-pressed=true],.btn.on{background:var(--vino2);color:#fff}
.btn.dor{background:var(--dorado);color:#fff}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
/* barra de escenario */
.sub{margin:6px 0 0;font-size:clamp(15px,1.5vw,19px);color:var(--tinta2)}
.acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:6px}
.btn.gran{background:var(--vino2);color:#fff;padding:11px 20px;font-size:14px;box-shadow:0 4px 14px var(--sombra)}
.btn.gran:hover{background:var(--vino);color:#fff}
.esc{position:sticky;top:0;z-index:5;background:var(--crema);padding-block:8px 8px;border-bottom:1px solid var(--arena)}
.esc .fila{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.esc .lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2)}
.chip{all:unset;box-sizing:border-box;cursor:pointer;background:var(--blanco);color:var(--tinta);border-radius:9999px;padding:5px 11px;font-size:12px;font-weight:600;box-shadow:0 1px 4px var(--sombra);transition:transform .2s,box-shadow .2s}
.chip b{color:var(--vino2)}
.chip small{color:var(--tinta2);font-weight:400}
.aviso{font-size:12px;color:var(--rojo);font-weight:700}
.chip:hover{transform:translateY(-1px);box-shadow:0 3px 8px var(--sombra)}
main{padding-block:12px 28px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--blanco);border-radius:18px;padding:10px 14px;box-shadow:0 3px 10px var(--sombra);display:flex;flex-direction:column;gap:2px;transition:transform .25s cubic-bezier(.34,1.4,.5,1),box-shadow .25s;min-width:0}
.kpi:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(107,45,62,.22)}
.kpi b{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(20px,2vw,27px);color:var(--vino);line-height:1.05;white-space:nowrap}
.kpi .tx{font-size:12px;line-height:1.25;color:var(--tinta)}
.kpi .tri{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;font-style:normal}
.kpi .tri i{font-style:normal;font-weight:700}
.kpi .tri.ne i{color:var(--tinta2)}
.kpi .tri .pv{color:#8a7f74;font-weight:400}
.kpi .tri .p{color:var(--rojo)}.kpi .tri .m{color:var(--verde)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.box{all:unset;box-sizing:border-box;cursor:pointer;background:var(--blanco);border-radius:22px;padding:12px 16px;box-shadow:0 3px 12px var(--sombra);display:flex;flex-direction:column;min-height:200px;min-width:0;transition:transform .25s cubic-bezier(.34,1.4,.5,1),box-shadow .25s}
.box:hover,.box:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgba(107,45,62,.22)}
.box .q{font-family:"DM Serif Display",serif;font-size:20px;color:var(--vino);line-height:1.1;text-wrap:balance}
.box .m{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin:6px 0 2px}
.box .m svg{width:100%;height:auto;max-height:120px}
.box .c{font-size:12.5px;font-weight:700;color:var(--vino2);min-height:2.5em;opacity:0;transform:translateY(5px);transition:opacity .25s,transform .25s}
.box:hover .c,.box:focus-visible .c{opacity:1;transform:none}
@media(hover:none){.box .c{opacity:1;transform:none}}
.box .gh{animation:bucleh 7s cubic-bezier(.34,1.3,.5,1) infinite;animation-delay:calc(var(--i,0)*.45s)}
.box .gk{animation:buclev 7s cubic-bezier(.34,1.3,.5,1) infinite;animation-delay:calc(var(--i,0)*.45s)}
@keyframes bucleh{0%{transform:scaleX(0);opacity:1}14%,90%{transform:none;opacity:1}98%{transform:none;opacity:0}100%{transform:scaleX(0);opacity:0}}
@keyframes buclev{0%{transform:scaleY(0);opacity:1}14%,90%{transform:none;opacity:1}98%{transform:none;opacity:0}100%{transform:scaleY(0);opacity:0}}
@keyframes fundir{from{opacity:0}to{opacity:1}}
.fncard{position:absolute;z-index:6;width:140px;background:#fff;border-radius:18px;padding:8px 8px 10px;box-shadow:0 10px 28px rgba(79,23,40,.28);pointer-events:none;text-align:center;animation:fundir .2s ease both}
.fncard .fn svg{width:100px;height:auto}
.fncard b{display:block;font-size:12.5px;color:var(--vino);margin-top:4px}
.insight ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.box .abre{font-size:11px;color:var(--tinta2);margin-top:3px}
.box[data-id="sostiene"]{grid-column:1/-1;min-height:170px}.box[data-id="sostiene"] .m svg{max-height:110px}
.box.rec{background:var(--vino2);color:var(--crema)}
.box.rec .q,.box.rec .c,.box.rec .abre{color:#f3d58a}
.box.rec ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--crema)}
.box.rec li{display:flex;gap:8px;align-items:center}
.box.rec i{font-style:normal;font-weight:700;background:#f3d58a;color:var(--vino);border-radius:50%;width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px}
.gk{animation:crece .9s cubic-bezier(.34,1.3,.5,1) both;transform-origin:bottom;transform-box:fill-box}
.gh{animation:creceh .9s cubic-bezier(.34,1.3,.5,1) both;transform-origin:left;transform-box:fill-box}
@keyframes crece{from{transform:scaleY(0)}to{transform:none}}
@keyframes creceh{from{transform:scaleX(0)}to{transform:none}}
/* detalle */
#det{position:fixed;inset:0;background:var(--crema);overflow:auto;z-index:20;animation:ent .3s cubic-bezier(.34,1.3,.5,1)}
@keyframes ent{from{opacity:0;transform:scale(.97) translateY(14px)}to{opacity:1;transform:none}}
.dd{max-width:1240px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.dd h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(25px,3.4vw,38px);line-height:1.1;color:var(--vino);margin:12px 0 10px;text-wrap:balance}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--tinta2);margin:0 0 8px;align-items:center}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.viz{background:var(--blanco);border-radius:22px;padding:10px;box-shadow:0 3px 12px var(--sombra);overflow:hidden;position:relative}
.viz svg{width:100%;height:auto;display:block;touch-action:pan-y}
.viz svg [data-drag]{cursor:grab;touch-action:none}
.viz svg text{pointer-events:none}
.rm{transition:transform .5s cubic-bezier(.34,1.2,.5,1),width .5s cubic-bezier(.34,1.2,.5,1),height .5s cubic-bezier(.34,1.2,.5,1),fill .35s,opacity .35s,stroke .35s}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.cifra{background:var(--blanco);border-radius:16px;padding:10px 14px;border-left:5px solid var(--dorado)}
.cifra b{display:block;font-family:"DM Serif Display",serif;font-weight:400;font-size:24px;color:var(--vino);line-height:1.1}
.cifra span{font-size:12.5px;display:block;color:var(--tinta)}
.cifra .et{margin-top:4px;display:inline-block}
.insight{background:var(--vino2);color:var(--crema);border-radius:18px;padding:12px 16px;font-size:15px;margin:12px 0}
.insight b{color:#f3d58a}
.fuentes{font-size:12px;color:var(--tinta2)}
.fuentes ul{margin:4px 0 0;padding-left:18px}
.nota{font-size:12.5px;color:var(--tinta2);margin:8px 0}
.cuenta{display:grid;grid-template-columns:1fr auto;gap:6px 16px;background:var(--blanco);border-radius:18px;padding:14px 18px;font-size:14px;color:var(--tinta)}
.cuenta .v{font-weight:700;color:var(--vino);text-align:right}
.cuenta .t{grid-column:1/-1;border-top:1px solid var(--arena);margin-top:4px;padding-top:8px;font-weight:700}
.dos{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:12px}
.panel{background:var(--blanco);border-radius:22px;padding:14px;box-shadow:0 3px 12px var(--sombra)}
.panel h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:20px;color:var(--vino);margin:0 0 8px}
.pal{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:10px;align-items:center;border-radius:16px;padding:10px 12px;margin-bottom:8px;background:var(--arena2);color:var(--tinta);transition:background .25s,transform .25s,box-shadow .25s}
.pal:hover{background:var(--arena)}
.pal .sw{width:42px;height:24px;border-radius:12px;background:var(--gris,#b9afa3);position:relative;flex:none;transition:background .25s}
.pal .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.34,1.5,.5,1)}
.pal[aria-pressed=true]{background:#efd9df;box-shadow:inset 0 0 0 2px var(--vino2)}
.pal[aria-pressed=true] .sw{background:var(--vino2)}
.pal[aria-pressed=true] .sw::after{transform:translateX(18px)}
.pal small{display:block;color:var(--tinta2);font-size:12px}
.pal b{font-size:13.5px}
.pals2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 10px}.pals2 .pal{margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ctlr{display:grid;grid-template-columns:1fr minmax(120px,1.2fr) 64px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}.ctlr input{width:100%;accent-color:var(--vino2)}.ctlr output{font-weight:700;color:var(--vino);text-align:right}
.ing{display:grid;grid-template-columns:1fr 70px;gap:2px 10px;align-items:center;margin-bottom:8px;font-size:12.5px}.ing .ingb{grid-column:1/2;height:12px;background:var(--arena2);border-radius:6px;overflow:hidden}.ing .ingb i{display:block;height:100%;background:var(--vino2);border-radius:6px;transition:width .5s}.ing b{grid-row:1/3;grid-column:2;text-align:right;color:var(--vino)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.opcion{background:var(--blanco);border-radius:18px;padding:12px 14px;border:2px solid var(--arena);display:flex;flex-direction:column;gap:6px}
.opcion.rec{border-color:var(--vino2);box-shadow:0 4px 14px var(--sombra)}
.opcion h4{margin:0;font-size:15px;color:var(--vino)}
.opcion ul{margin:0;padding-left:18px;font-size:13px;color:var(--tinta)}
.opcion .pro{color:var(--verde)}
.opcion .con{color:var(--rojo)}
.rcard{background:var(--blanco);border-radius:22px;padding:16px;box-shadow:0 3px 12px var(--sombra);margin-bottom:14px}
.rcard h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:22px;color:var(--vino);margin:0 0 4px}
.rcard .porque{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.rcard .porque b{font-family:"DM Serif Display",serif;font-weight:400;font-size:30px;color:var(--vino)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.rcard{position:relative;display:flex;flex-direction:column;gap:8px;animation:fundir .5s ease both;animation-delay:calc(var(--i,0)*.08s)}
.rcard .num{position:absolute;top:12px;right:14px;font-family:"DM Serif Display",serif;font-size:34px;color:var(--arena)}
.rcard h3{padding-right:36px}
.rcard .por{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rcard .por b{font-family:"DM Serif Display",serif;font-weight:400;font-size:34px;color:var(--vino)}
.rcard .por span{font-size:13px;color:var(--tinta2)}
.rcard .si{font-size:13px;background:#f6e4e4;border-radius:12px;padding:7px 12px}
.rcard .si i{font-style:normal;font-weight:700;color:var(--rojo);margin-right:6px}
.rcard .acc2{display:flex;gap:8px;flex-wrap:wrap}
.ejemplo{font-size:13px;background:var(--arena2);border-radius:14px;padding:8px 12px;margin-top:10px;color:var(--tinta)}
.tt{position:fixed;pointer-events:none;background:var(--tinta);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:10px;z-index:40;max-width:280px}
.sr{position:absolute;left:-9999px}
.pulso{animation:pulso 1.3s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.62}}
/* presentación */
#intro{position:fixed;inset:0;z-index:50;background:var(--vino);color:var(--crema);display:flex;flex-direction:column;justify-content:center;padding:20px max(16px,4vw) 80px}
#intro svg{width:100%;height:auto;max-height:calc(100vh - 120px);display:block;margin:0 auto}
#intro .barras{position:absolute;left:max(16px,4vw);right:max(16px,4vw);bottom:20px;display:flex;gap:6px;align-items:center}
#intro .barras i{flex:1;height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
#intro .barras i b{display:block;height:100%;width:0;background:#f3d58a}
#intro .barras i.act b{width:100%;transition:width 5.5s linear}
#intro .skip{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#intro .btn{background:rgba(255,255,255,.16);color:#fff}
#intro .btn:hover{background:rgba(255,255,255,.28)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.dos{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.box{min-height:170px}.viz{overflow-x:auto}.viz svg{min-width:760px}.desliza{display:block!important}.esc .fila{gap:6px}}
.desliza{display:none;font-size:11.5px;color:var(--tinta2);margin:0 0 6px;font-weight:700}
@media(prefers-reduced-motion:reduce){.box .gh,.box .gk,.fncard{animation:none}#det,.gk,.gh,#intro .sl>*,.pulso{animation:none}.rm,.box,.kpi,.chip,.btn,.pal,#intro .barras i.act b{transition:none}}
</style>
<div class="wrap">
  <header class="top">
    <div><div class="kick">Planos de Carta · 14 de noviembre de 2026 · versión 8</div>
    <h1 class="op">Carta hoy, Carta mañana</h1><p class="sub" id="oportunidad"></p></div>
    <div class="acc"><button class="btn gran" id="verIntro">▶ Ver la presentación</button><span id="pantallaTop"></span><span class="et prop">propuesta · la v1 no cobra</span></div>
  </header>
  <main>
    <div class="kpis" id="kpis"></div>
    <div class="grid" id="grid"></div>
    <p class="nota">Las cifras responden al escenario activo. Los supuestos llevan su etiqueta; planes y precios son propuesta; lo que la Fase 3 aún no construye está en futuro; no se venden datos.</p>
  </main>
</div>
<div id="det" hidden role="dialog" aria-modal="true" aria-label="Detalle"></div>
<div id="intro" hidden role="dialog" aria-modal="true" aria-label="Presentación"></div>
