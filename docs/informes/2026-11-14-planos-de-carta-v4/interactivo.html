:root{color-scheme:light;--crema:#fef9f1;--vino:#4f1728;--vino2:#6b2d3e;--dorado:#b8860b;--tinta:#1a1a1a;--tinta2:#5b4a3d;--arena:#e6d9c6;--arena2:#f3eadb;--blanco:#ffffff;--verde:#3f6b3b;--rojo:#9b2c2c;--sombra:rgba(107,45,62,.14)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"DM Sans",sans-serif;background:var(--crema);color:var(--tinta);min-height:100vh}
button,select,input{font:inherit;color:var(--tinta)}
button{cursor:pointer}
svg text{font-family:"DM Sans",sans-serif}
.serif{font-family:"DM Serif Display",serif;font-weight:400}
a{color:var(--vino2)}
:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
/* cabecera */
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:16px 8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.kick{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta2);font-weight:700}
h1.op{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(26px,3.4vw,42px);line-height:1.08;color:var(--vino);margin:4px 0 0;max-width:980px;text-wrap:balance}
.et{font-size:10.5px;font-weight:700;border-radius:9999px;padding:2px 9px;border:1.5px solid var(--dorado);color:var(--dorado);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:transparent}
.et.prop{border-color:var(--vino2);color:var(--vino2)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;border-radius:9999px;padding:9px 16px;min-height:40px;font-size:13px;font-weight:700;background:var(--arena2);color:var(--tinta2);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,transform .2s}
.btn:hover{background:var(--arena);color:var(--tinta)}
.btn[aria-pressed=true],.btn.on{background:var(--vino2);color:#fff}
.btn.dor{background:var(--dorado);color:#fff}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
/* barra de escenario */
.esc{position:sticky;top:0;z-index:5;background:var(--crema);padding-block:8px 8px;border-bottom:1px solid var(--arena)}
.esc .fila{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.esc .lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2)}
.chip{all:unset;box-sizing:border-box;cursor:pointer;background:var(--blanco);color:var(--tinta);border-radius:9999px;padding:5px 11px;font-size:12px;font-weight:600;box-shadow:0 1px 4px var(--sombra);transition:transform .2s,box-shadow .2s}
.chip b{color:var(--vino2)}
.chip:hover{transform:translateY(-1px);box-shadow:0 3px 8px var(--sombra)}
main{padding-block:12px 28px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--blanco);border-radius:18px;padding:10px 14px;box-shadow:0 3px 10px var(--sombra);display:flex;flex-direction:column;gap:2px;transition:transform .25s cubic-bezier(.34,1.4,.5,1),box-shadow .25s;min-width:0}
.kpi:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(107,45,62,.22)}
.kpi b{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(20px,2vw,27px);color:var(--vino);line-height:1.05;white-space:nowrap}
.kpi span{font-size:12px;line-height:1.25;color:var(--tinta)}
.kpi small{font-size:10px;color:var(--tinta2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.box{all:unset;box-sizing:border-box;cursor:pointer;background:var(--blanco);border-radius:22px;padding:12px 16px;box-shadow:0 3px 12px var(--sombra);display:flex;flex-direction:column;min-height:200px;min-width:0;transition:transform .25s cubic-bezier(.34,1.4,.5,1),box-shadow .25s}
.box:hover,.box:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgba(107,45,62,.22)}
.box .q{font-family:"DM Serif Display",serif;font-size:20px;color:var(--vino);line-height:1.1;text-wrap:balance}
.box .m{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin:6px 0 2px}
.box .m svg{width:100%;height:auto;max-height:120px}
.box .c{font-size:12.5px;font-weight:700;color:var(--vino2)}
.box .abre{font-size:11px;color:var(--tinta2);margin-top:3px}
.box.rec{background:var(--vino2);color:var(--crema)}
.box.rec .q,.box.rec .c,.box.rec .abre{color:#f3d58a}
.box.rec ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--crema)}
.box.rec li{display:flex;gap:8px;align-items:center}
.box.rec i{font-style:normal;font-weight:700;background:#f3d58a;color:var(--vino);border-radius:50%;width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px}
.gk{animation:crece .9s cubic-bezier(.34,1.3,.5,1) both;transform-origin:bottom;transform-box:fill-box}
.gh{animation:creceh .9s cubic-bezier(.34,1.3,.5,1) both;transform-origin:left;transform-box:fill-box}
@keyframes crece{from{transform:scaleY(0)}to{transform:none}}
@keyframes creceh{from{transform:scaleX(0)}to{transform:none}}
/* detalle */
#det{position:fixed;inset:0;background:var(--crema);overflow:auto;z-index:20;animation:ent .3s cubic-bezier(.34,1.3,.5,1)}
@keyframes ent{from{opacity:0;transform:scale(.97) translateY(14px)}to{opacity:1;transform:none}}
.dd{max-width:1240px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}

    b += T(X0 + W, yb0 + hb + 24, `Mes ${r.t}: ingreso ${mxn(Math.round(r.ingreso))} · costo ${mxn(Math.round(r.costo))} · margen ${r.margen < 0 ? "−" : ""}${mxn(Math.abs(Math.round(r.margen)))}`, 12.5, C.tinta, "end", 700);

    sv.innerHTML = b;
  },
};

/* ===== detalle de cada cifra de arriba: de dónde sale ===== */
function cuentaDet(titulo, fu, filas, insight) {
  return {
    titulo, fu, montar(host) { host.innerHTML = `<div class="cuenta" id="cu"></div>`; },
    actualizar() {
      const rows = filas();
      $("#cu").innerHTML = rows.map(([a, v, tot]) => `<div${tot ? ' class="t"' : ""}>${a}</div><div class="v${tot ? " t" : ""}">${v}</div>`).join("");
      return {insight: insight(), cifras: []};
    },
  };
}

let introT = null, introI = 0;
function cerrarIntro() { clearTimeout(introT); $("#intro").hidden = true; document.body.style.overflow = ""; try { localStorage.setItem("carta-v5-intro", "1"); } catch (e) { /* ignorar */ } }
function mostrarSlide(i) {
  clearTimeout(introT); introI = i;
  if (i >= SLIDES.length) { cerrarIntro(); return; }
  $$("#intro .sl").forEach((s, k) => s.classList.toggle("on", k === i));
  $$("#intro .barras i").forEach((b, k) => { b.className = k < i ? "hecha" : ""; });
  const act = $$("#intro .barras i")[i]; void act.offsetWidth; act.className = REDUCE ? "hecha" : "act";
  if (!REDUCE) introT = setTimeout(() => mostrarSlide(i + 1), 5500);
}
function abrirIntro() {
  const el = $("#intro");
  el.innerHTML = `<button class="btn skip" data-intro="saltar">Saltar ✕</button>` + SLIDES.map(([k, h, c]) => `<div class="sl"><div class="kick" style="color:#d9b9c1">${k}</div><h2 class="g">${h}</h2><p class="ci">${c}</p></div>`).join("") + `<div class="barras">${SLIDES.map(() => "<i><b></b></i>").join("")}<button class="btn" data-intro="sig" style="margin-left:10px">Siguiente →</button></div>`;
  el.hidden = false; document.body.style.overflow = "hidden"; mostrarSlide(0);
  el.onclick = ev => { const b = ev.target.closest("[data-intro]"); if (!b) return; if (b.dataset.intro === "saltar") cerrarIntro(); else mostrarSlide(introI + 1); };
}
