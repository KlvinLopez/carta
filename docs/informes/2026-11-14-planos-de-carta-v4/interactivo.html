:root{--crema:#fef9f1;--vino:#4f1728;--vino2:#6b2d3e;--dorado:#b8860b;--tinta:#1a1a1a;--tinta2:#5b4a3d;--arena:#e6d9c6;--arena2:#f3eadb;--azul:#2e7aab;--verde:#4f7a4a;--gris:#b9afa3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"DM Sans",sans-serif;background:var(--crema);color:var(--tinta);min-height:100vh}
svg text{font-family:"DM Sans",sans-serif}
.serif{font-family:"DM Serif Display",serif;font-weight:400}
header.top{max-width:1320px;margin:0 auto;padding:18px 20px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kick{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta2);font-weight:700}
.hero{font-family:"DM Serif Display",serif;font-size:clamp(40px,6vw,60px);line-height:1;color:var(--vino);margin:2px 0 0}
.alcance{margin:2px 0 0;font-size:14px;color:var(--tinta2)}
.et{font-size:10.5px;font-weight:700;border-radius:9999px;padding:2px 9px;border:1.5px solid var(--dorado);color:var(--dorado);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.et.prop{border-color:var(--vino2);color:var(--vino2)}
.et.med{border-color:var(--verde);color:var(--verde)}
main{max-width:1320px;margin:0 auto;padding:12px 20px 28px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 3px 10px rgba(107,45,62,.12)}
.kpi b{display:block;font-family:"DM Serif Display",serif;font-weight:400;font-size:26px;color:var(--vino);line-height:1.05;white-space:nowrap}
.kpi span{font-size:12px;line-height:1.25;display:block}
.cita{font-size:10px;color:var(--tinta2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.box{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:22px;padding:12px 16px 12px;box-shadow:0 3px 12px rgba(107,45,62,.13);display:flex;flex-direction:column;min-height:196px;transition:transform .25s cubic-bezier(.34,1.4,.5,1),box-shadow .25s}
.box:hover,.box:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgba(107,45,62,.22)}
.box:focus-visible{outline:3px solid var(--dorado)}
.box .q{font-family:"DM Serif Display",serif;font-size:21px;color:var(--vino);line-height:1.1}
.box .m{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin:6px 0 2px}
.box .m svg{width:100%;height:auto;max-height:118px}
.box .c{font-size:12.5px;font-weight:700;color:var(--vino2)}
.box .abre{font-size:11px;color:var(--tinta2);margin-top:3px}
.box.dec{background:var(--vino2);color:var(--crema)}
.box.dec .q,.box.dec .c{color:#f3d58a}
.box.dec ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.box.dec li{display:flex;gap:8px;align-items:center}
.box.dec i{font-style:normal;font-weight:700;background:#f3d58a;color:var(--vino);border-radius:50%;width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px}
/* detalle */
#det{position:fixed;inset:0;background:var(--crema);overflow:auto;z-index:10;animation:ent .28s cubic-bezier(.34,1.3,.5,1)}
@keyframes ent{from{opacity:0;transform:scale(.97) translateY(14px)}to{opacity:1;transform:none}}
.dd{max-width:1180px;margin:0 auto;padding:16px 20px 40px}
.vuelve{all:unset;cursor:pointer;background:var(--vino2);color:var(--crema);border-radius:9999px;padding:10px 18px;font-size:14px;font-weight:700;min-height:44px;display:inline-flex;align-items:center}
.vuelve:focus-visible,.ctl button:focus-visible{outline:3px solid var(--dorado)}
.dd h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(26px,3.6vw,38px);line-height:1.12;color:var(--vino);margin:14px 0 4px}
.como{font-size:13.5px;color:var(--tinta2);margin:0 0 12px}
.como b{color:var(--vino2)}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:#fff;border-radius:18px;padding:10px 14px;margin-bottom:12px}
.ctl label{font-size:13px;font-weight:700;color:var(--tinta2);display:flex;align-items:center;gap:8px}
.ctl input[type=range]{width:min(240px,60vw);accent-color:var(--vino2)}
.ctl output{font-weight:700;color:var(--vino);min-width:3ch;display:inline-block}
.ctl select{font:inherit;padding:8px 10px;border-radius:12px;border:1.5px solid var(--arena);background:var(--crema);min-height:40px}
.ctl .opt{all:unset;cursor:pointer;border-radius:9999px;padding:9px 15px;min-height:40px;font-size:13px;font-weight:700;background:var(--arena2);color:var(--tinta2);display:inline-flex;align-items:center}
.ctl .opt[aria-pressed=true]{background:var(--vino2);color:#fff}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-height:40px}
.sw input{width:20px;height:20px;accent-color:var(--vino2)}
.viz{background:#fff;border-radius:22px;padding:10px;box-shadow:0 3px 12px rgba(107,45,62,.1);overflow:hidden}
.viz svg{width:100%;height:auto;display:block}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.cifra{background:#fff;border-radius:16px;padding:10px 14px;border-left:5px solid var(--dorado)}
.cifra b{display:block;font-family:"DM Serif Display",serif;font-weight:400;font-size:24px;color:var(--vino);line-height:1.1}
.cifra span{font-size:12.5px;display:block}
.insight{background:var(--vino2);color:var(--crema);border-radius:18px;padding:12px 16px;font-size:14.5px;margin:12px 0}
.insight b{color:#f3d58a}

      const eq = PL.equilibrio, fijo = PL.costo_fijo_1000, X = p => 70 + 560 * p / 45, Y = v => 40 + 260 * (10000 - v) / 13000;
      let b = [-2569, 0, 5000, 10000].map(v => `<line x1="70" x2="630" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? C.t2 : C.arena}"/>` + T(62, Y(v) + 4, n(v), 11.5, C.t2, "end")).join("");
      [["249", C.gris], ["299", C.dorado], ["349", C.vino]].forEach(([k, c]) => { b += `<polyline points="${X(0)},${Y(-fijo)} ${X(45)},${Y(eq[k].margen_por_pagante * 45 - fijo)}" fill="none" stroke="${c}" stroke-width="${k == pp ? 5 : 2.5}" opacity="${k == pp ? 1 : 0.55}"/><circle cx="${X(eq[k].pagantes_para_cubrir_fijo)}" cy="${Y(0)}" r="7" fill="${c}" stroke="#fff" stroke-width="2"/>`; });
      b += `<circle cx="${X(e.pagantes)}" cy="${Y(e.neto_mes)}" r="10" fill="none" stroke="${C.tinta}" stroke-width="3"/>` + T(350, 336, "pagantes por cada 1,000 registrados", 12.5, C.t2, "middle");
      [0, 10, 20, 30, 40].forEach(p => { b += T(X(p), 318, p, 12, C.t2, "middle"); });
      b += Rc(690, 40, 250, 250, "#fff", 20, `stroke="${C.arena}" stroke-width="1.5"`) + T(706, 72, "Tu escenario", 14, C.vino, "start", 700) + T(706, 120, n(e.pagantes, e.pagantes % 1 ? 1 : 0), 44, C.vino, "start", 400, true) + T(706, 142, "pagantes por 1,000", 13, C.t2) + T(706, 196, n(e.ingreso_mes), 28, C.vino, "start", 400, true) + T(706, 216, "pesos de ingreso al mes", 13, C.t2) + T(706, 262, (e.neto_mes < 0 ? "−" : "") + n(Math.abs(e.neto_mes)) + " neto", 24, e.neto_mes < 0 ? "#9b2c2c" : C.verde, "start", 700);
      el.innerHTML = SV(960, 350, b);
      el.insertAdjacentHTML("beforeend", marcaCifras([[eq[String(pp)].pagantes_para_cubrir_fijo, `pagantes por 1,000 cubren el fijo (${n(fijo)} al mes) a ${pp}`, ""], [n(e.costo_de_atender_pagantes), "pesos: costo de atender a los pagantes (piso)", ""], ["supuestos", "% que rebasa y % que paga: los mide el piloto", "supuesto"]]));
    },
  },
  dec: {
    titulo: "Cinco decisiones que te tocan.",
    como: "Cada una cambia un número de las cajas anteriores.",
    fu: ["carta_precio", "carta_disco", "carta_tres_planes"],
    insight: "Ninguna se decide con más análisis: K, el sustituto y el soporte se cierran con el piloto de 10 restaurantes.",
    controles: () => "",
    pinta(st, el) {
      const t = [["K: qué tan agresivo entrar", "De 0.3 a 0.7. Contra Fudo Avanzado el precio va de 249 a 449; contra Meniu es 249 siempre.", "precio"], ["Contra quién se compite", "Meniu (225) da 249; Fudo Avanzado (652) da 299; Fudo con mesas (745) da 349, con K = 0.5.", "precio"],
        ["Tope de platillos del gratuito", "Con 80 empuja a 10.8 %; con 60, a 24.3 %; con 40, a 52.7 %.", "planes"], ["Historial", "Si se ofrece como complemento y hasta cuándo se guarda; hoy 03 §7 purga a 24 meses. No se venden datos.", "disco"], ["Soporte al mes", "60 pesos (30 minutos) o 150: con 150 el precio sube a ≈ 556. Se mide en el piloto.", "precio"]];
      el.innerHTML = `<div class="cifras" style="grid-template-columns:1fr">${t.map(([a, b, k], i) => `<div class="cifra" style="border-left-color:var(--vino2)"><b style="font-size:20px">${i + 1}. ${a}</b><span>${b}</span><button class="opt" style="margin-top:6px;background:var(--arena2);padding:6px 12px;min-height:36px" data-ir="${k}">ver la caja</button></div>`).join("")}</div>`;

const K0 = [["94 %", "del núcleo no declara sitio web", ["inegi_denue"]], ["≈ 100,000", "negocios servibles", ["carta_mercado"]], ["299 → 2,116", "gratuitos caben con eventos", ["carta_anuncios"]], ["14 → 128", "de paga caben en 5 GB", ["carta_disco"]], ["≈ 39 %", "rebasaría los topes (supuesto)", ["carta_tres_planes"]], ["9.7", "pagantes por 1,000 cubren el fijo a 349", ["carta_tres_planes"]]];
document.getElementById("kpis").innerHTML = K0.map(([a, b, c]) => `<div class="kpi"><b>${a}</b><span>${b}</span><span class="cita">(${cita(...c)})</span></div>`).join("");
document.getElementById("grid").innerHTML = CAJAS.map(c => `<button class="box" data-id="${c.id}" aria-label="${esc(c.q)}"><div class="q">${esc(c.q)}</div><div class="m">${c.mini()}</div><div class="c">${esc(c.c)}</div><div class="abre">toca para abrir ›</div></button>`).join("") +
  `<button class="box dec" data-id="dec"><div class="q">Decisiones que te tocan</div><ol>${DEC.map((t, i) => `<li><i>${i + 1}</i>${esc(t)}</li>`).join("")}</ol><div class="abre" style="color:#f3d58a;margin-top:auto">toca para abrir ›</div></button>`;

/* ---------- detalle a pantalla completa ---------- */
const det = document.getElementById("det"), tt = document.getElementById("tt");
let abierto = null, estado = {}, ultimoFoco = null;
function abre(id) {
  const d = DET[id]; if (!d) return;
  ultimoFoco = document.activeElement; abierto = id; estado = {};
  det.hidden = false; document.body.style.overflow = "hidden";
  det.innerHTML = `<div class="dd"><button class="vuelve" id="vuelve">← Volver</button><h2 id="dt">${esc(d.titulo)}</h2><p class="como"><b>Cómo leerlo.</b> ${esc(d.como)}</p>${d.controles()}<p class="desliza">Desliza la gráfica de lado →</p><div class="viz" id="viz"></div><div id="cif"></div><div class="insight"><b>Insight clave.</b> ${esc(d.insight)}</div>${d.nota ? `<p class="nota">${esc(d.nota)}</p>` : ""}${fuentes(d.fu)}</div>`;
  const viz = det.querySelector("#viz");
  const dibuja = () => {
    d.pinta(estado, viz);
    const cif = viz.querySelector(".cifras"); if (cif) det.querySelector("#cif").replaceChildren(cif); else det.querySelector("#cif").replaceChildren();
    const svgEl = viz.querySelector("svg"); if (svgEl) svgEl.setAttribute("aria-label", d.titulo);
  };
  det.querySelector("#vuelve").onclick = cierra;
  det.querySelectorAll(".opt[data-k]").forEach(b => b.onclick = () => { estado.k = b.dataset.k; det.querySelectorAll(".opt[data-k]").forEach(x => x.setAttribute("aria-pressed", x === b)); dibuja(); });
  det.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => { cierra(); abre(b.dataset.ir); });
  if (id === "disco") det.querySelectorAll("input[data-p]").forEach(cb => cb.onchange = () => {
    const ord = ["P1", "P2", "P3", "P4", "P5"], i = ord.indexOf(cb.dataset.p);
    det.querySelectorAll("input[data-p]").forEach((o, j) => { o.checked = cb.checked ? j <= i : j < i; });
    estado.on = det.querySelectorAll("input[data-p]:checked").length; dibuja();
  });
  if (id === "planes") det.querySelector("#rg").oninput = e => { estado.r = e.target.value; det.querySelector("#og").textContent = PL.cobertura_platillos[+e.target.value].tope; dibuja(); };
  if (id === "precio") {
    det.querySelector("#rk").oninput = e => { estado.k = e.target.value; det.querySelector("#ok").textContent = (+e.target.value).toFixed(2); dibuja(); };
    det.querySelector("#rs").oninput = e => { estado.s = e.target.value; det.querySelector("#os").textContent = e.target.value; dibuja(); };
    det.querySelector("#ss").onchange = e => { estado.sus = e.target.value; dibuja(); };
  }
  if (id === "eq") { det.querySelector("#er").onchange = e => { estado.r = e.target.value; dibuja(); }; det.querySelector("#ec").onchange = e => { estado.c = e.target.value; dibuja(); }; det.querySelector("#ep").onchange = e => { estado.p = e.target.value; dibuja(); }; }
  dibuja(); det.scrollTop = 0; det.querySelector("#vuelve").focus();
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
function cierra() { det.hidden = true; det.innerHTML = ""; abierto = null; document.body.style.overflow = ""; tt.hidden = true; history.replaceState(null, "", location.pathname); if (ultimoFoco && document.contains(ultimoFoco)) ultimoFoco.focus(); }
document.getElementById("grid").addEventListener("click", e => { const b = e.target.closest(".box"); if (b) abre(b.dataset.id); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && abierto) cierra();
  if (e.key === "Tab" && abierto) { const f = [...det.querySelectorAll("button,input,select,a[href]")].filter(x => !x.disabled); if (!f.length) return; const a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
});
function muestraTip(e) { const t = e.target.closest("[data-tip]"); if (!t) { tt.hidden = true; return; } tt.textContent = t.dataset.tip; tt.hidden = false; const r = t.getBoundingClientRect(); tt.style.left = Math.min(Math.max(8, r.left + r.width / 2 - 130), innerWidth - 270) + "px"; tt.style.top = Math.max(8, r.top - tt.offsetHeight - 8) + "px"; }
det.addEventListener("mouseover", muestraTip); det.addEventListener("focusin", muestraTip); det.addEventListener("mouseout", () => tt.hidden = true); det.addEventListener("click", muestraTip);
if (location.hash && DET[location.hash.slice(1)]) abre(location.hash.slice(1));
