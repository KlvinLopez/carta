# Las acciones de CI van fijadas por SHA en .github/workflows/*.yml; Dependabot propone las
# actualizaciones (SHA y comentario del tag) una vez por semana.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  # Imágenes base del Dockerfile y de deploy/respaldo: tag + digest @sha256 (T-0.7); Dependabot
  # actualiza los dos juntos.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    ignore:
      # Node mayor (22 → 26) se decide a mano y junto con `ci.yml` (job frontend) y la
      # versión que usa Vite; Dependabot sólo propone parches y menores del mismo LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Python va fijado en 3.12 por `.python-version` y `pyproject.toml` (uv, mypy, ruff):
      # subir de versión es una decisión del plan, no una actualización automática.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /deploy/respaldo
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
