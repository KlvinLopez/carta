# Las acciones de CI van fijadas por SHA en .github/workflows/*.yml; Dependabot propone las
# actualizaciones (SHA y comentario del tag) una vez por semana.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  # Imágenes base del Dockerfile y de deploy/respaldo (tags; los digests @sha256 quedan para T-0.7).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: /deploy/respaldo
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
