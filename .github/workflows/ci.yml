# CI de Carta (T-0.4): la misma puerta de calidad que se corre antes de cada commit
# (CLAUDE.md § Comandos), sobre PostgreSQL 16 real. El job `imagen` (T-0.6) construye y
# arranca la imagen de Docker: es el comando de Verificar de T-0.6, que en las sesiones de
# agente no se puede correr porque no hay daemon de Docker.
#
# Corre en push a `master`, en cada pull request y también en push a las ramas de agente
# (`agente/**`, `claude/**`): así cada rama de agente tiene CI sin abrir PR y la sesión maestra
# ve el resultado antes de integrar (04_Fases_y_Tareas §11).
#
# Las acciones van fijadas por SHA completo (el tag es sólo comentario): este workflow es la
# puerta de integración y un tag es mutable. Dependabot (.github/dependabot.yml) propone las
# actualizaciones.
name: CI

on:
  push:
    branches:
      - master
      - "agente/**"
      - "claude/**"
  pull_request:
  workflow_dispatch:

# Un push a una rama con PR abierto cae en una sola corrida (`head_ref` es la rama en ambos
# eventos); las corridas de `master` nunca se cancelan.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # Credenciales de la base efímera del job, no un secreto real.
  DATABASE_URL: postgresql+asyncpg://carta:carta_ci@localhost:5432/carta_test
  TEST_DATABASE_URL: postgresql+asyncpg://carta:carta_ci@localhost:5432/carta_test
  # Pública a propósito; está en `SECRETOS_DE_EJEMPLO` para que `Settings` la rechace fuera de pruebas.
  SECRET_KEY: clave-solo-para-ci-de-github-actions-sin-valor-real-0123456789
  ENTORNO: pruebas

jobs:
  calidad:
    name: Lint, tipos, pruebas y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carta
          POSTGRES_PASSWORD: carta_ci
          POSTGRES_DB: carta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carta -d carta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python (versión de .python-version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Dependencias (uv sync --locked)
        # `--locked` falla si uv.lock no está al día con pyproject.toml.
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy (app y scripts)
        run: uv run mypy

      - name: app/services no importa FastAPI ni Starlette (regla dura 2)
        run: |
          mkdir -p app/services
          # Sólo sentencias de importación, no texto en comentarios o docstrings.
          con_framework="$(grep -rlE --include='*.py' '^\s*(from|import)\s+(fastapi|starlette)\b' app/services/ | wc -l)"
          if [ "$con_framework" -ne 0 ]; then
            echo "::error::app/services/ importa fastapi o starlette en $con_framework archivo(s):"
            grep -rlE --include='*.py' '^\s*(from|import)\s+(fastapi|starlette)\b' app/services/
            exit 1
          fi

      - name: pytest --cov=app
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered -q -rfE

      - name: pip-audit (sobre uv.lock)
        # Corre aunque un paso anterior haya fallado: una vulnerabilidad no debe esperar a que
        # pase el lint. Audita el lock exportado, no el venv: determinista y sin resolver con pip.
        if: ${{ !cancelled() }}
        run: |
          uv export --frozen --no-emit-project --no-hashes -o "${RUNNER_TEMP}/requisitos.txt"
          uv run pip-audit --strict --progress-spinner off --disable-pip --no-deps \
            -r "${RUNNER_TEMP}/requisitos.txt"

  imagen:
    # El Verificar de T-0.6 (04_Fases_y_Tareas §4), tal cual, más la migración desde la imagen.
    # Corre en paralelo con `calidad`: no depende de ella.
    name: Imagen portable (docker build + humo)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carta
          POSTGRES_PASSWORD: carta_ci
          POSTGRES_DB: carta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carta -d carta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker build
        run: docker build -t carta:test .

      - name: docker run (la base del job, vista desde el contenedor como host.docker.internal)
        run: |
          docker run -d -p 127.0.0.1:8000:8000 --env-file .env.example -e ENTORNO=pruebas \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL=postgresql+asyncpg://carta:carta_ci@host.docker.internal:5432/carta_test \
            --name carta-test carta:test
          sleep 3
          # Hasta 30 s más por si el arranque de los workers tarda en el runner.
          for intento in $(seq 1 30); do
            curl -sf localhost:8000/health > /dev/null && break
            sleep 1
          done

      - name: Verificar del brief
        run: |
          curl -sf localhost:8000/health
          curl -sf localhost:8000/ | grep -q '<div id="app"'
          curl -sI localhost:8000/ | grep -i content-security-policy
          docker compose -f deploy/vps/docker-compose.yml config > /dev/null
          echo ok

      - name: La base responde y la migración corre desde la imagen (comando previo al despliegue)
        run: |
          curl -sf localhost:8000/ready | grep -q '"db":"ok"'
          docker exec carta-test uv run alembic upgrade head
          docker exec carta-test uv run alembic current | grep -q '(head)'
          # El comando previo de Railway y de la VM (T-0.7) corre desde la imagen y es idempotente.
          docker exec carta-test uv run python scripts/predespliegue.py
          docker exec carta-test uv run alembic current | grep -q '(head)'

      - name: Cachés, 404 JSON, cabeceras y logs JSON del supervisor
        run: |
          curl -sI localhost:8000/ | grep -i 'cache-control: no-cache'
          asset="$(curl -s localhost:8000/ | grep -o '/assets/[^"]*\.js' | head -1)"
          test -n "$asset"
          curl -sI "localhost:8000$asset" | grep -i 'cache-control: public, max-age=31536000, immutable'
          curl -sI localhost:8000/fonts/DMSans-variable-latin.woff2 | grep -i 'immutable'
          curl -sI localhost:8000/fonts/DMSans-variable-latin.woff2 | grep -i 'content-type: font/woff2'
          curl -sI localhost:8000/assets/no-existe.js | grep -i 'cache-control: no-store'
          curl -sI localhost:8000/health | grep -i 'x-frame-options: deny'
          curl -sI localhost:8000/health | grep -i "frame-ancestors 'none'"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/docs)" = "404"
          curl -sI localhost:8000/manifest.webmanifest | grep -i 'content-type: application/manifest+json'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/nada)" = "404"
          curl -s localhost:8000/api/v1/nada | grep -q RECURSO_NO_ENCONTRADO
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/assets/no-existe.js)" = "404"
          curl -sI localhost:8000/health | grep -i 'x-content-type-options: nosniff'
          curl -sI localhost:8000/health | grep -i 'referrer-policy: strict-origin-when-cross-origin'
          curl -sI localhost:8000/health | grep -i 'permissions-policy'
          # En pruebas no hay HSTS (sólo staging y producción).
          ! curl -sI localhost:8000/health | grep -qi strict-transport-security
          # El supervisor (proceso padre) también escribe JSON por línea. A un archivo: bajo
          # pipefail `head` cerraría el tubo y `docker logs` saldría con 141.
          docker logs carta-test > "$RUNNER_TEMP/logs.txt" 2>&1
          head -1 "$RUNNER_TEMP/logs.txt" | grep -q '^{"ts"'
          grep -q 'Started parent process' "$RUNNER_TEMP/logs.txt"
          # El contenedor corre sin privilegios y el HEALTHCHECK pasa (la primera sonda corre
          # tras el intervalo de 30 s).
          test "$(docker exec carta-test id -u)" != "0"
          for intento in $(seq 1 60); do
            test "$(docker inspect -f '{{.State.Health.Status}}' carta-test)" = "healthy" && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' carta-test)" = "healthy"

      - name: Imagen de respaldo
        run: |
          docker build -t carta-respaldo:test deploy/respaldo
          docker run --rm carta-respaldo:test sh -c 'pg_dump --version && age --version && rclone version | head -1'
          # Sin variables sale con 2 y dice cuál falta.
          set +e; docker run --rm carta-respaldo:test; estado=$?; set -e
          test "$estado" = "2"

      - name: Logs del contenedor
        if: always()
        run: docker logs carta-test || true

  frontend:
    # La puerta del frontend (CLAUDE.md «Comandos»): pruebas, build y presupuesto. Antes ningún paso
    # corría vitest, y un «Unhandled Error» de T-1.12 pasó sin que nadie lo viera. No depende de `calidad`.
    name: Frontend (vitest, build y presupuesto)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22 (el de la imagen Docker)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias
        run: npm --prefix frontend ci

      - name: Pruebas (vitest; el código de salida decide, aunque todas pasen)
        run: npm --prefix frontend test -- --run

      - name: Build (tsc -b + vite)
        run: npm --prefix frontend run build

      - name: Presupuesto del bundle
        run: node frontend/scripts/presupuesto.mjs
