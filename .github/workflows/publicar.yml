# Publicar una versión a producción con Calvin como «human in the loop» (T-0.7, 05_Operacion §3).
#
#   Camino normal: un PR que cambia el archivo `VERSION` (p. ej. a `v0.0.2`). Al fusionarlo en
#   `master`, este workflow corre solo: espera a que ci.yml termine en verde sobre ese commit,
#   crea la etiqueta, publica la Release y lanza «Despliegue a producción» (deploy.yml), que se
#   detiene en su trabajo `produccion` hasta que Calvin lo aprueba (Environment `produccion` →
#   Required reviewers, deploy/railway/README.md paso F.6). Nadie llega a producción sin ese toque.
#   La sesión maestra «lanza» una versión abriendo ese PR; fusionarlo es la primera validación de
#   Calvin y aprobar el despliegue, la segunda.
#
#   Camino manual: Actions → «Publicar versión» → Run workflow con `version: v0.0.2` (la API de
#   GitHub con la que trabaja la sesión no puede lanzar workflows: 403).
#
# Por qué deploy.yml se lanza aparte: la etiqueta se crea con GITHUB_TOKEN y GitHub no dispara
# workflows por eventos de ese token (el `push: tags` de deploy.yml no se enteraría);
# `workflow_dispatch` sí está permitido. Las acciones van fijadas por SHA completo (el tag es
# comentario), como en ci.yml.
name: Publicar versión

on:
  push:
    branches:
      - master
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar sobre master, p. ej. v0.0.2 (si se omite, la de VERSION)"
        required: false
        type: string

permissions:
  contents: write # la etiqueta y la Release
  actions: write # lanzar deploy.yml

# Una publicación a la vez.
concurrency:
  group: publicar-version
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publicar:
    name: Etiqueta, Release y lanzamiento del despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Versión a publicar (la del formulario o la del archivo VERSION)
        id: version
        env:
          PEDIDA: ${{ inputs.version }}
        run: |
          version="${PEDIDA:-$(tr -d '[:space:]' < VERSION)}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' no tiene la forma vX.Y.Z (p. ej. v0.0.2)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Versión $version sobre $(git rev-parse --short HEAD)."

      - name: La versión no existe todavía
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::La etiqueta $VERSION ya existe. Para volver a desplegarla usa «Despliegue a producción» → Run workflow (rollback)."
            exit 1
          fi

      - name: El CI pasó en la punta de master (espera hasta 20 min a que termine)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          base="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"
          for intento in $(seq 1 40); do
            exitos="$(gh api "$base?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')"
            if [ "$exitos" != "0" ]; then
              echo "CI en verde para $SHA."
              exit 0
            fi
            fallos="$(gh api "$base?head_sha=$SHA&status=failure&per_page=1" --jq '.total_count')"
            if [ "$fallos" != "0" ]; then
              echo "::error::ci.yml falló en $SHA: no se publica. Arregla master y vuelve a intentarlo."
              exit 1
            fi
            echo "ci.yml todavía no termina en $SHA (intento $intento/40)…"
            sleep 30
          done
          echo "::error::ci.yml no terminó en 20 min para $SHA: relanza este workflow cuando esté en verde."
          exit 1

      - name: Etiqueta sobre master (por la API, sin credenciales en el checkout)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$SHA" --jq '.ref'

      - name: Release en GitHub con notas generadas
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --verify-tag --title "Carta $VERSION" --generate-notes

      - name: Lanzar «Despliegue a producción» (espera la aprobación en el Environment produccion)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh workflow run deploy.yml --ref master -f "etiqueta=$VERSION"
          echo "Lanzado. Aprobación pendiente en https://github.com/$GITHUB_REPOSITORY/actions/workflows/deploy.yml"
