# Despliegue a PRODUCCIÓN en Railway (T-0.7, ADR-015, 05_Operacion §3).
#
#   git tag v0.0.1 && git push origin v0.0.1        → despliega esa etiqueta a producción
#   Actions → «Despliegue a producción» → Run workflow con `etiqueta: v0.0.1`
#                                                     → vuelve a desplegar una etiqueta (rollback
#                                                       por código, también desde el teléfono)
#
# STAGING NO PASA POR AQUÍ: el servicio `api` del environment `staging` de Railway está conectado
# al repositorio y se despliega solo con cada push a la rama que se elija en el panel (Settings →
# Source → Branch; `master`, o `claude/gifted-allen-rqjiup` mientras no exista el merge). Ver
# deploy/railway/README.md.
#
# Tres trabajos:
#   verificar   la etiqueta tiene forma vX.Y.Z y el CI (ci.yml) pasó en ese mismo commit.
#   produccion  `railway up` del código de la etiqueta al servicio `api` de `produccion`; Railway
#               construye el Dockerfile, corre el comando previo (alembic upgrade head), espera a
#               /health y cambia el tráfico. Después, prueba de humo contra https://carta.cooking.
#   publicar    la misma etiqueta como imagen en GHCR (`ghcr.io/klvinlopez/carta:<etiqueta>` y
#               `:latest`, más `carta-respaldo`) para la variante de VM (deploy/vps/). Vive aquí y no
#               en ci.yml porque sólo corre en etiquetas: ci.yml no se dispara con etiquetas y
#               añadírselas repetiría `calidad` e `imagen` sobre un commit que ya pasó.
#
# Único secreto: RAILWAY_TOKEN, un *project token* del environment `produccion` (Railway →
# proyecto → Settings → Tokens). GITHUB_TOKEN (`github.token`) sólo escribe paquetes, y sólo en
# `publicar`. Las acciones van fijadas por SHA completo (el tag es comentario), como en ci.yml.
name: Despliegue a producción

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta a desplegar (p. ej. v0.0.1). Para un rollback, la anterior."
        required: true
        type: string

# Un despliegue a producción nunca cancela a otro a medias: el siguiente espera su turno.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

permissions:
  contents: read

env:
  # La etiqueta viaja siempre por variable de entorno, nunca interpolada dentro de un `run`.
  ETIQUETA: ${{ github.event_name == 'workflow_dispatch' && inputs.etiqueta || github.ref_name }}

jobs:
  verificar:
    name: Etiqueta válida y CI en verde
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: La etiqueta tiene forma vX.Y.Z
        run: |
          if ! [[ "$ETIQUETA" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::La etiqueta '$ETIQUETA' no tiene la forma vX.Y.Z (p. ej. v0.0.1)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.ETIQUETA }}
          persist-credentials: false

      - name: Commit de la etiqueta
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: El CI pasó en ese commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          exitos="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')"
          if [ "$exitos" = "0" ]; then
            echo "::error::El CI (ci.yml) no tiene una corrida en verde para $SHA. Empuja ese commit a master (o a la rama de staging), espera el CI y vuelve a etiquetar."
            exit 1
          fi
          echo "CI en verde para $SHA ($ETIQUETA)."

  produccion:
    name: Railway (produccion) + prueba de humo
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Versión fijada de la CLI y SHA-256 del binario oficial
      # (github.com/railwayapp/cli/releases, v5.71.0 del 19 de octubre de 2026). Para subir de
      # versión: descargar el nuevo .tar.gz, `sha256sum` y cambiar las dos líneas juntas.
      RAILWAY_CLI_VERSION: "5.71.0"
      RAILWAY_CLI_SHA256: "2e682fd2ddf8d6fdf9e46d9d99d99646ff0022a6abb0c2bca93011348a269fb9"
      URL_PRODUCCION: https://carta.cooking

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verificar.outputs.sha }}
          persist-credentials: false

      - name: CLI de Railway (versión fijada, descarga verificada)
        run: |
          archivo="railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archivo" \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/$archivo"
          echo "${RAILWAY_CLI_SHA256}  $RUNNER_TEMP/$archivo" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archivo" -C "$RUNNER_TEMP/bin" railway
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/railway" --version

      - name: railway up (sube el código de la etiqueta y espera a que el despliegue quede activo)
        # Sin --detach ni --ci la CLI espera al final del despliegue: sale con 0 si llega a
        # SUCCESS (build + comando previo + /health) y con 1 si falla o se cae. .railwayignore
        # deja fuera docs/, marketing/ y lo demás que la imagen no usa.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SHA: ${{ needs.verificar.outputs.sha }}
        run: |
          railway up --environment produccion --service api --message "$ETIQUETA ($SHA)"

      - name: Prueba de humo contra https://carta.cooking
        run: |
          # Hasta 5 minutos: el CNAME de Cloudflare apunta al despliegue nuevo en cuanto Railway
          # cambia el tráfico, pero damos margen.
          for intento in $(seq 1 30); do
            curl -sf https://carta.cooking/health > /dev/null && break
            sleep 10
          done
          curl -sf https://carta.cooking/health
          curl -sf https://carta.cooking/ready | grep -q '"db":"ok"'
          curl -sf https://carta.cooking/ | grep -q '<div id="app"'
          curl -sI https://carta.cooking/ | grep -i content-security-policy
          curl -sI https://carta.cooking/ | grep -i strict-transport-security
          echo "### Producción en ${URL_PRODUCCION} con ${ETIQUETA}" >> "$GITHUB_STEP_SUMMARY"

  publicar:
    name: Imagen en GHCR (variante de VM)
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGEN: ghcr.io/klvinlopez/carta
      IMAGEN_RESPALDO: ghcr.io/klvinlopez/carta-respaldo
      FUENTE: https://github.com/KlvinLopez/carta

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verificar.outputs.sha }}
          persist-credentials: false

      - name: docker login ghcr.io (GITHUB_TOKEN)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Construir y publicar (etiqueta y latest)
        # La etiqueta OCI `source` liga el paquete al repositorio en GitHub. Un rollback con
        # workflow_dispatch sobre una etiqueta vieja mueve también `latest` a esa versión.
        run: |
          docker build \
            --label "org.opencontainers.image.source=$FUENTE" \
            --label "org.opencontainers.image.version=$ETIQUETA" \
            -t "$IMAGEN:$ETIQUETA" -t "$IMAGEN:latest" .
          docker build \
            --label "org.opencontainers.image.source=$FUENTE" \
            --label "org.opencontainers.image.version=$ETIQUETA" \
            -t "$IMAGEN_RESPALDO:$ETIQUETA" -t "$IMAGEN_RESPALDO:latest" deploy/respaldo
          docker push "$IMAGEN:$ETIQUETA"
          docker push "$IMAGEN:latest"
          docker push "$IMAGEN_RESPALDO:$ETIQUETA"
          docker push "$IMAGEN_RESPALDO:latest"

      - name: docker logout
        if: always()
        run: docker logout ghcr.io
