[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carta"
version = "0.1.0"
description = "Carta: menú visual por QR, orden compartida en la mesa y comanda directa al personal"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Calvin", email = "calvinisheamus20@gmail.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "anthropic>=1.0",
    "pillow>=10.4",
    "qrcode[pil]>=8.0",
    "reportlab>=4.2",
    "pypdf>=5.0",
    "boto3>=1.35",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "sentry-sdk[fastapi]>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "frontend", "marketing", "prototipo", "stitch", "deploy", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` en valores por defecto es el idioma de FastAPI, no un error.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Cookie", "fastapi.File", "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Un solo bucle de eventos para toda la sesión: una conexión asyncpg sólo sirve en el bucle
# donde nació, y el motor de pruebas (tests/conftest.py) vive toda la sesión.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "ac(*ids): criterios de aceptación (AC-x.y) que cubre la prueba; los lee scripts/verificar_trazabilidad.py",
    "live: usa la API real de Claude; requiere ANTHROPIC_API_KEY y se corre a mano",
]
