[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carta"
version = "0.1.0"
description = "Intelligent restaurant menu platform with AI-powered personalization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Calvin", email = "calvinisheamus20@gmail.com" }
]

dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "firebase-admin==6.2.0",
    "httpx==0.25.2",
    "redis==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "ruff==0.1.11",
    "black==23.12.1",
    "mypy==1.7.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=html --cov-report=term"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
