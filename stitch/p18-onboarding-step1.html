<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>

        },

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .vino-gradient {
            background: linear-gradient(135deg, #4f1728 0%, #6b2d3e 100%);
        }
        .glass-blur {
            backdrop-filter: blur(24px);
            background: rgba(254, 249, 241, 0.7);
        }
        .editorial-shadow {
            box-shadow: 0px 20px 40px rgba(29, 28, 23, 0.06);
        }
        body {
            min-height: 100dvh;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- Top Navigation Header -->
<header class="w-full top-0 pt-6 flex items-center justify-between px-8 max-w-2xl mx-auto sticky z-50 bg-background/80 backdrop-blur-md">
<div class="flex-1 flex items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full" style="background-color: #FFD700;"></div>
<div class="w-2.5 h-2.5 rounded-full border border-outline-variant"></div>
<div class="w-2.5 h-2.5 rounded-full border border-outline-variant"></div>
</div>
<div class="flex-none">
<span class="font-headline text-lg tracking-tight text-primary">Paso 1 de 3</span>
</div>
</header>
<main class="flex-grow flex flex-col px-8 max-w-2xl mx-auto w-full pt-10 pb-10">
<!-- Hero Section: Floating Gourmet Dish -->
<div class="relative w-full aspect-square flex items-center justify-center mb-10 mt-6">
<!-- Background "Aura" -->
<div class="absolute inset-0 bg-primary-fixed/20 rounded-full blur-3xl transform scale-75"></div>
<!-- 3D Render Image Container -->
<div class="relative z-10 w-full h-full transform transition-transform hover:scale-105 duration-700">
<img alt="Gourmet Dessert" class="w-full h-full object-contain drop-shadow-[0_35px_35px_rgba(79,23,40,0.15)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7HH0g2o785cyxFIhijOCuj7-KyKCyyrlIskYI-PAB8y8VYUUwkt91OWO4jQ4XYRxQH1VWIlE4FxH45MCNThyp1R5NhMtJ_0bXYo5Lfu6ohR3yizxRN-OJnMtH6AU40j6-r0LQeEQ9VI-j9Dz9qzlumiuihsRUU0Zea4kXeb71njkmPAU9EhoPv8o3OJO4Z86UC_QH96Bs869uO39iAkVqUsVxmK08j61iITZYBzJ6mnzEvI0Ndcl3IJlFdRJ38bgl2cqhoWOKgr0"/>
</div>
<!-- Floating Accessory Element -->
<div class="absolute -bottom-4 right-4 bg-surface-container-lowest editorial-shadow rounded-xl px-4 py-3 flex items-center gap-3 glass-blur border border-outline-variant/10">
<span class="material-symbols-outlined text-secondary" style='font-variation-settings: "FILL" 1;'>stars</span>
<span class="text-xs font-semibold tracking-wider uppercase text-on-surface-variant">Experiencia Carta</span>
</div>
</div>
<!-- Editorial Content Area -->
<div class="flex flex-col gap-5 text-center">
<h1 class="font-headline text-4xl md:text-5xl text-on-background leading-[1.1] tracking-tight">
                Tu menú, <span class="italic font-normal">Tu Carta.</span>
</h1><p class="text-lg font-brand italic text-primary leading-relaxed mt-2">Elevando el arte de la mesa</p>
<div class="space-y-4 mx-auto max-w-md">
<p class="text-lg text-on-surface-variant font-light leading-relaxed">
<span class="font-headline italic font-bold text-primary">Carta</span> aprende tus gustos para mostrarte lo que más vas a disfrutar.
                </p>
</div>
</div>
<!-- Bottom CTA Area pushed to bottom -->
<div class="mt-auto pt-20">
<button class="w-full py-5 vino-gradient text-on-primary rounded-full text-lg font-medium tracking-wide shadow-xl shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                Empezar
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Footer Text -->
<p class="text-center mt-6 text-[10px] text-outline font-label uppercase tracking-[0.25em]">
                Comienza tu viaje gastronómico
            </p>
</div>
</main>
<!-- Bottom spacing -->
<div class="h-6 md:h-10"></div>
</body></html>
